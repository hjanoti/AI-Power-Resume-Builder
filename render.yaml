# Render Deployment Configuration
# Copy this to render.yaml in the root directory
# Or use these settings in the Render Dashboard

services:
  - type: web
    name: ai-resume-builder-api
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ai-power-resume-builder.netlify.app
      # Add these in Render Dashboard (Environment Secrets):
      # - JWT_SECRET: your_jwt_secret_here
      # - MONGODB_URL: your_mongodb_connection_string
      # - IMAGEKIT_PRIVATE_KEY: your_private_key
      # - IMAGEKIT_PUBLIC_KEY: your_public_key
      # - IMAGEKIT_URL_ENDPOINT: your_url_endpoint
      # - OPENAI_API_KEY: your_gemini_api_key
      # - OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      # - OPENAI_MODEL: gemini-2.5-flash

# Alternative: Use this as a Blueprint for "Deploy to Render" button
